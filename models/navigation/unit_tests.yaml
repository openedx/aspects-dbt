unit_tests:
  - name: test_dim_learner_last_course_visit
    model: dim_learner_last_course_visit
    config:
      tags: 'ci'
    given:
      - input: ref('navigation_events')
        format: sql
        rows: |
          select * from navigation_events
    expect:
      format: sql
      rows: |
        select * from dim_learner_last_course_visit_expected

  - name: test_fact_navigation_completion
    model: fact_navigation_completion
    config:
      tags: 'ci'
    given:
      - input: ref('fact_learner_page_visits')
        format: sql
        rows: |
          select * from fact_learner_page_visits
      - input: ref('dim_course_blocks')
        format: sql
        rows: |
          select * from dim_course_blocks
      - input: ref('dim_course_subsection_items')
        format: sql
        rows: |
          select * from dim_course_subsection_items
    expect:
      format: sql
      rows: |
        select * from fact_navigation_completion_expected
  - name: test_navigation_events
    model: navigation_events
    config:
      tags: 'ci'
    given:
      - input: ref('xapi_events_all_parsed')
        format: sql
        rows: |
          select * from xapi_events_all_parsed
    expect:
      format: sql
      rows: |
        select * from navigation_events_expected

  - name: test_fact_learner_page_visits
    model: fact_learner_page_visits
    config:
      tags: 'ci'
    given:
      - input: ref('navigation_events')
        format: sql
        rows: |
          select * from navigation_events
    expect:
      format: sql
      rows: |
        select * from fact_learner_page_visits_expected

  - name: test_fact_pageview_engagement_sections
    model: fact_pageview_engagement
    config:
      tags: 'ci'
    given:
      - input: ref('fact_learner_page_visits')
        format: sql
        rows: |
          select * from engagement_fixture_page_visits
      - input: ref('dim_course_blocks')
        format: sql
        rows: |
          select * from engagement_fixture_course_blocks
      - input: ref('dim_course_subsection_items')
        format: sql
        rows: |
          select * from engagement_fixture_subsection_items
      - input: ref('dim_user_pii')
        format: sql
        rows: |
          select * from engagement_fixture_user_pii
    expect:
      format: sql
      rows: |
        select * from fact_pageview_engagement_fixture_expected
