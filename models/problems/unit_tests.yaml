unit_tests:
  - name: test_dim_learner_last_response
    model: dim_learner_last_response
    config:
      tags: 'ci'
    given:
      - input: ref('problem_events')
        format: sql
        rows: |
          select * from problem_events
      - input: ref('dim_course_blocks')
        format: sql
        rows: |
          select * from dim_course_blocks
    expect:
      format: sql
      rows: |
        select * from dim_learner_last_response_expected

  - name: test_dim_problem_responses
    model: dim_problem_responses
    config:
      tags: 'ci'
    given:
      - input: ref('problem_events')
        format: sql
        rows: |
          select * from problem_events
      - input: ref('dim_course_blocks')
        format: sql
        rows: |
          select * from dim_course_blocks
    expect:
      format: sql
      rows: |
        select expected.*, identities.problem_id
        from dim_problem_responses_expected expected
        join (
          select distinct course_key, problem_id
          from dim_learner_last_response_expected
        ) identities
          on expected.course_key = identities.course_key
          and endsWith(identities.problem_id, concat('+block@', expected.block_id_short))

  - name: test_dim_problem_results
    model: dim_problem_results
    config:
      tags: 'ci'
    given:
      - input: ref('dim_learner_last_response')
        format: sql
        rows: |
          select * from dim_learner_last_response
      - input: ref('dim_course_blocks')
        format: sql
        rows: |
          select * from dim_course_blocks
    expect:
      format: sql
      rows: |
        select expected.*, latest.problem_id
        from dim_problem_results_expected expected
        join dim_learner_last_response_expected latest
          on expected.course_key = latest.course_key
          and expected.actor_id = latest.actor_id
          and endsWith(latest.problem_id, concat('+block@', expected.block_id_short))

  - name: test_fact_problem_engagement
    model: fact_problem_engagement
    config:
      tags: 'ci'
    given:
      - input: ref('fact_learner_problem_attempts')
        format: sql
        rows: |
          select * from fact_learner_problem_attempts
      - input: ref('dim_course_blocks')
        format: sql
        rows: |
          select * from dim_course_blocks
      - input: ref('dim_course_subsection_items')
        format: sql
        rows: |
          select * from dim_course_subsection_items
      - input: ref('dim_user_pii')
        format: sql
        rows: |
          select * from dim_user_pii
    expect:
      format: sql
      rows: |
        select * from fact_problem_engagement_expected
  - name: test_problem_events
    model: problem_events
    config:
      tags: 'ci'
    given:
      - input: ref('xapi_events_all_parsed')
        format: sql
        rows: |
