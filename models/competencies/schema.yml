version: 2

models:
  - name: dim_learner_most_recent_competency_status
    docs:
        node_color: '{{ var("color_event_sink") }}'
    description: "Latest mastery status per learner and competency. Read with FINAL"
    columns:
      - name: id
        data_type: Int64
        description: '{{ doc("id") }}'
      - name: actor_id
        data_type: String
        description: "The learner's xAPI actor id"
      - name: tag_id
        data_type: Int64
        description: "Foreign key to the competency tag"
      - name: taxonomy_id
        data_type: Int64
        description: "Foreign key to the competency's taxonomy"
      - name: status_id
        data_type: UInt8
        description: "Mastery status (openedx-core MasteryStatus): 20 PartiallyAttempted, 30 Demonstrated"
      - name: status_name
        data_type: LowCardinality(String)
        description: "Mastery status name"
      - name: created
        data_type: DateTime64(6)
        description: "When the learner first got a status for the competency"
      - name: modified
        data_type: DateTime64(6)
        description: "When the status last changed"
      - name: time_last_dumped
        data_type: DateTime64(6)
        description: '{{ doc("time_last_dumped") }}'

  - name: dim_learner_most_recent_competency_course_status
    docs:
        node_color: '{{ var("color_event_sink") }}'
    description: "Latest mastery status per learner, competency and course run (course-level criteria groups). Read with FINAL"
    columns:
      - name: id
        data_type: Int64
        description: '{{ doc("id") }}'
      - name: actor_id
        data_type: String
        description: "The learner's xAPI actor id"
      - name: group_id
        data_type: Int64
        description: "The openedx-core course-level criteria group id"
      - name: tag_id
        data_type: Int64
        description: "Foreign key to the competency tag the group evaluates"
      - name: taxonomy_id
        data_type: Int64
        description: "Foreign key to the competency's taxonomy"
      - name: course_key
        data_type: String
        description: "The course run of the course-level group"
      - name: status_id
        data_type: UInt8
        description: "Mastery status (openedx-core MasteryStatus): 10 AttemptedNotDemonstrated, 20 PartiallyAttempted, 30 Demonstrated"
      - name: status_name
        data_type: LowCardinality(String)
        description: "Mastery status name"
      - name: created
        data_type: DateTime64(6)
        description: "When the learner first got a status for the competency in this course run"
      - name: modified
        data_type: DateTime64(6)
        description: "When the status last changed"
      - name: time_last_dumped
        data_type: DateTime64(6)
        description: '{{ doc("time_last_dumped") }}'
