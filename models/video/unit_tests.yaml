unit_tests:  
  - name: test_fact_video_engagement
    model: fact_video_engagement
    config:
      tags: 'ci'
    given:
      - input: ref('fact_video_watch_intervals')
        format: sql
        rows: |
          select * from fact_video_watch_intervals
      - input: ref('dim_course_blocks')
        format: sql
        rows: |
          select * from dim_course_blocks
      - input: ref('dim_user_pii')
        format: sql
        rows: |
          select * from dim_user_pii
    expect:
      format: sql
      rows: |
        select * from fact_video_engagement_expected

  - name: test_fact_video_segments
    model: fact_video_segments
    config:
      tags: 'ci'
    given:
      - input: ref('fact_video_watch_intervals')
        format: sql
        rows: |
          select * from fact_video_watch_intervals
    expect:
      format: sql
      rows: |
        select * from fact_video_segments_expected

  - name: test_fact_video_watch_intervals
    model: fact_video_watch_intervals
    config:
      tags: 'ci'
    overrides:
      env_vars:
        # The fixture events are older than the default window.
        ASPECTS_VIDEO_WATCH_INTERVALS_LOOKBACK: "100 YEAR"
      macros:
        # Pin the wall-clock version column.
        video_watch_intervals_computed_at: "toDateTime64('2024-01-01 00:00:00.000000', 6)"
    given:
      - input: ref('video_playback_events')
        format: sql
        rows: |
          select * from video_playback_events
    expect:
      format: sql
      rows: |
        select * from fact_video_watch_intervals_expected

  - name: test_video_playback_events
    model: video_playback_events
    config:
      tags: 'ci'
    given:
      - input: ref('xapi_events_all_parsed')
        format: sql
        rows: |
          select * from xapi_events_all_parsed
    expect:
      format: sql
      rows: |
        select * from video_playback_events_expected
