unit_tests:  
  - name: test_fact_video_engagement
    model: fact_video_engagement
    config:
      tags: 'ci'
    given:
      - input: ref('fact_video_watches')
        format: sql
        rows: |
          select * from fact_video_watches
      - input: ref('dim_course_blocks')
        format: sql
        rows: |
          select * from dim_course_blocks
      - input: ref('dim_course_subsection_items')
        format: sql
        rows: |
          select * from dim_course_subsection_items
      - input: ref('dim_user_pii')
        format: sql
        rows: |
          select * from dim_user_pii
    expect:
      format: sql
      rows: |
        select * from fact_video_engagement_expected
  - name: test_fact_video_segments
    model: fact_video_segments
    config:
      tags: 'ci'
    given:
      - input: ref('fact_video_watch_intervals')
        format: sql
        rows: |
          select * from fact_video_watch_intervals
    expect:
      format: sql
      rows: |
        select * from fact_video_segments_expected

  - name: test_fact_video_watch_intervals
    model: fact_video_watch_intervals
    config:
      tags: 'ci'
    overrides:
      env_vars:
        # The fixture events are older than the default window.
        ASPECTS_VIDEO_WATCH_INTERVALS_LOOKBACK: "100 YEAR"
      macros:
        # Pin the wall-clock version column.
        video_watch_intervals_computed_at: "toDateTime64('2024-01-01 00:00:00.000000', 6)"
    given:
      - input: ref('video_playback_events')
        format: sql
        rows: |
          select * from video_playback_events
    expect:
      format: sql
      rows: |
        select * from fact_video_watch_intervals_expected

  - name: test_video_playback_events
    model: video_playback_events
    config:
      tags: 'ci'
    given:
      - input: ref('xapi_events_all_parsed')
        format: sql
        rows: |
          select * from xapi_events_all_parsed
    expect:
      format: sql
      rows: |
        select * from video_playback_events_expected

  - name: test_video_playback_events_keeps_sub_second_time
    description: "emission_time_long keeps the microseconds that order events within a second"
    model: video_playback_events
    config:
      tags: 'ci'
    given:
      - input: ref('xapi_events_all_parsed')
        format: sql
        rows: |
          select
              toUUID('00000000-0000-0000-0000-000000000001') as event_id,
              'https://w3id.org/xapi/video/verbs/paused' as verb_id,
              'learner' as actor_id,
              'http://localhost:18000/xblock/block-v1:Org0+C+R+type@video+block@v' as object_id,
              'http://localhost:18000/course/course-v1:Org0+C+R' as course_id,
              'course-v1:Org0+C+R' as course_key,
              'Org0' as org,
              toDateTime64('2024-01-01 00:00:10.250000', 6) as emission_time,
              '{"result": {"extensions": {"https://w3id.org/xapi/video/extensions/time": 10}},
                "context": {"extensions": {"https://w3id.org/xapi/video/extensions/length": 60}}}'
              as event
    expect:
      format: sql
      rows: |
        select
            toUUID('00000000-0000-0000-0000-000000000001') as event_id,
            toDateTime64('2024-01-01 00:00:10.250000', 6) as emission_time_long,
            toDateTime('2024-01-01 00:00:10') as emission_time,
            'learner' as actor_id,
            'http://localhost:18000/xblock/block-v1:Org0+C+R+type@video+block@v' as object_id,
            'course-v1:Org0+C+R' as course_key,
            'Org0' as org,
            'https://w3id.org/xapi/video/verbs/paused' as verb_id,
            toDecimal32(10, 2) as video_position,
            toInt64(60) as video_duration

  - name: test_fact_video_engagement_sections
    model: fact_video_engagement
    config:
      tags: 'ci'
    given:
      - input: ref('fact_video_watches')
        format: sql
        rows: |
          select * from engagement_fixture_video_watches
      - input: ref('dim_course_blocks')
        format: sql
        rows: |
          select * from engagement_fixture_course_blocks
      - input: ref('dim_course_subsection_items')
        format: sql
        rows: |
          select * from engagement_fixture_subsection_items
      - input: ref('dim_user_pii')
        format: sql
        rows: |
          select * from engagement_fixture_user_pii
    expect:
      format: sql
      rows: |
        select * from fact_video_engagement_fixture_expected

  - name: test_fact_video_watches
    description: "Overlapping and re-watched intervals; open intervals don't count"
    model: fact_video_watches
    config:
      tags: 'ci'
    overrides:
      env_vars:
        ASPECTS_VIDEO_WATCH_INTERVALS_LOOKBACK: "100 YEAR"
      macros:
        video_watch_intervals_computed_at: "toDateTime64('2024-01-01 00:00:00.000000', 6)"
    given:
      - input: ref('fact_video_watch_intervals')
        format: sql
        rows: |
          select 'Org0' as org, 'course-v1:Org0+C+R' as course_key,
              'http://localhost:18000/xblock/block-v1:Org0+C+R+type@video+block@v1' as object_id,
              'a' as actor_id, toUUID('00000000-0000-4000-8000-000000000001') as start_event_id,
              toDateTime64('2024-01-01 00:00:01', 6) as start_emission_time,
              toDecimal32(0, 2) as start_video_position, toNullable(toDecimal32(30, 2)) as end_video_position,
              'https://w3id.org/xapi/video/verbs/paused' as end_verb_id, toInt64(60) as video_duration,
              1 as is_interval_closed, 1 as is_watched,
              toDateTime64('2024-01-01 00:00:00', 6) as computed_at
          union all
          select 'Org0' as org, 'course-v1:Org0+C+R' as course_key,
              'http://localhost:18000/xblock/block-v1:Org0+C+R+type@video+block@v1' as object_id,
              'a' as actor_id, toUUID('00000000-0000-4000-8000-000000000002') as start_event_id,
              toDateTime64('2024-01-01 00:00:02', 6) as start_emission_time,
              toDecimal32(10, 2) as start_video_position, toNullable(toDecimal32(20, 2)) as end_video_position,
              'https://w3id.org/xapi/video/verbs/paused' as end_verb_id, toInt64(60) as video_duration,
              1 as is_interval_closed, 1 as is_watched,
              toDateTime64('2024-01-01 00:00:00', 6) as computed_at
          union all
          select 'Org0' as org, 'course-v1:Org0+C+R' as course_key,
              'http://localhost:18000/xblock/block-v1:Org0+C+R+type@video+block@v1' as object_id,
              'a' as actor_id, toUUID('00000000-0000-4000-8000-000000000003') as start_event_id,
              toDateTime64('2024-01-01 00:00:03', 6) as start_emission_time,
              toDecimal32(40, 2) as start_video_position, toNullable(toDecimal32(50, 2)) as end_video_position,
              'https://w3id.org/xapi/video/verbs/paused' as end_verb_id, toInt64(60) as video_duration,
              1 as is_interval_closed, 1 as is_watched,
              toDateTime64('2024-01-01 00:00:00', 6) as computed_at
          union all
          select 'Org0' as org, 'course-v1:Org0+C+R' as course_key,
              'http://localhost:18000/xblock/block-v1:Org0+C+R+type@video+block@v1' as object_id,
              'a' as actor_id, toUUID('00000000-0000-4000-8000-000000000004') as start_event_id,
              toDateTime64('2024-01-01 00:00:04', 6) as start_emission_time,
              toDecimal32(50, 2) as start_video_position, CAST(NULL, 'Nullable(Decimal(9, 2))') as end_video_position,
              'https://w3id.org/xapi/video/verbs/paused' as end_verb_id, toInt64(60) as video_duration,
              0 as is_interval_closed, 0 as is_watched,
              toDateTime64('2024-01-01 00:00:00', 6) as computed_at
          union all
          select 'Org0' as org, 'course-v1:Org0+C+R' as course_key,
              'http://localhost:18000/xblock/block-v1:Org0+C+R+type@video+block@v1' as object_id,
              'b' as actor_id, toUUID('00000000-0000-4000-8000-000000000005') as start_event_id,
              toDateTime64('2024-01-01 00:00:05', 6) as start_emission_time,
              toDecimal32(5, 2) as start_video_position, toNullable(toDecimal32(6, 2)) as end_video_position,
              'https://w3id.org/xapi/video/verbs/paused' as end_verb_id, toInt64(60) as video_duration,
              1 as is_interval_closed, 1 as is_watched,
              toDateTime64('2024-01-01 00:00:00', 6) as computed_at
    expect:
      format: sql
      rows: |
        select 'Org0' as org, 'course-v1:Org0+C+R' as course_key,
            'http://localhost:18000/xblock/block-v1:Org0+C+R+type@video+block@v1' as object_id,
            'a' as actor_id, toInt64(60) as video_duration, toUInt64(40) as watched_seconds,
            toUInt64(2) as max_views, toDateTime64('2024-01-01 00:00:00', 6) as computed_at
        union all
        select 'Org0', 'course-v1:Org0+C+R',
            'http://localhost:18000/xblock/block-v1:Org0+C+R+type@video+block@v1',
            'b', toInt64(60), toUInt64(1), toUInt64(1), toDateTime64('2024-01-01 00:00:00', 6)
