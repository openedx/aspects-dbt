version: 2

models:
  - name: fact_video_engagement
    description: "A dataset with one record representing the engagement of a learner with a video"
    columns:
      - name: org
        data_type: string
        description: '{{ doc("org") }}'
      - name: course_key
        data_type: string
        description: '{{ doc("course_key") }}'
      - name: section_subsection_name
        data_type: string
        description: "The name of the section or the subsection"
      - name: content_level
        data_type: string
        description: "The content level of the video"
        data_tests:
          - accepted_values:
              values:
                - 'section'
                - 'subsection'
      - name: actor_id
        data_type: string
        description: '{{ doc("actor_id") }}'
      - name: section_subsection_video_engagement
        data_type: string
        description: "The engagement level of the learner with the video"
        data_tests:
          - accepted_values:
              values:
                - 'No videos viewed yet'
                - 'At least one video viewed'
                - 'All videos viewed'
      - name: block_id
        data_type: String
        description: '{{ doc("block_id") }}'
      - name: username
        data_type: String
        description: '{{ doc("username") }}'
      - name: name
        data_type: String
        description: '{{ doc("learner_name") }}'
      - name: email
        data_type: String
        description: '{{ doc("email") }}'

  - name: fact_video_watch_intervals
    description: "One row per played event and the event that closed it"
    columns:
      - name: org
        data_type: string
        description: '{{ doc("org") }}'
      - name: course_key
        data_type: string
        description: '{{ doc("course_key") }}'
      - name: object_id
        data_type: string
        description: '{{ doc("object_id") }}'
      - name: actor_id
        data_type: string
        description: '{{ doc("actor_id") }}'
      - name: start_event_id
        data_type: uuid
        description: "The id of the played event that opened this interval"
      - name: start_emission_time
        data_type: DateTime64(6)
        description: "When the played event that opened this interval was emitted"
      - name: start_video_position
        data_type: decimal(9, 2)
        description: "The position in the video where this interval started"
      - name: end_video_position
        data_type: Nullable(decimal(9, 2))
        description: "The position in the video where this interval ended; null while open"
      - name: end_verb_id
        data_type: string
        description: "The verb IRI of the event that closed this interval; empty while open"
      - name: video_duration
        data_type: int64
        description: "The duration of the video in seconds"
      - name: is_interval_closed
        data_type: UInt8
        description: "Whether an event closing this play has been seen"
      - name: is_watched
        data_type: UInt8
        description: "Whether this interval is closed and moved forward in the video"
      - name: computed_at
        data_type: DateTime64(6)
        description: "When this row was computed"

  - name: fact_video_segments
    description: "One row per second of each watched interval; a second watched twice appears twice"
    columns:
      - name: org
        data_type: string
        description: '{{ doc("org") }}'
      - name: course_key
        data_type: string
        description: '{{ doc("course_key") }}'
      - name: actor_id
        data_type: string
        description: '{{ doc("actor_id") }}'
      - name: object_id
        data_type: string
        description: '{{ doc("object_id") }}'
      - name: video_duration
        data_type: Int32
        description: "Total duration of the video"
      - name: watched_segment
        data_type: Int32
        description: "Watched second of the video"
      - name: watch_count
        data_type: UInt64
        description: "Always 1; sum it per second to count views"

  - name: video_playback_events
    docs:
        node_color: '{{ var("color_xapi") }}'
    description: "Events related to video playback"
    columns:
      - name: event_id
        data_type: uuid
        description: '{{ doc("event_id") }}'
      - name: emission_time_long
        data_type: DateTime64(6)
        description: 'Emission time with extra time digits'
      - name: emission_time
        data_type: DateTime
        description: '{{ doc("emission_time") }}'
      - name: actor_id
        data_type: string
        description: '{{ doc("actor_id") }}'
      - name: object_id
        data_type: string
        description: '{{ doc("object_id") }}'
      - name: course_key
        data_type: string
        description: '{{ doc("course_key") }}'
      - name: org
        data_type: string
        description: '{{ doc("org") }}'
      - name: verb_id
        data_type: string
        description: '{{ doc("verb_id") }}'
      - name: video_position
        data_type: decimal(9, 2)
        description: "The position in the video where the event occurred"
      - name: video_duration
        data_type: int64
        description: "The duration of the video in seconds"

