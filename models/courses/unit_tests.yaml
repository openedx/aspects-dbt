unit_tests:
  - name: test_dim_course_block_names
    model: dim_course_block_names
    given:
      - input: ref('dim_most_recent_course_blocks')
        format: sql
        rows: |
          select * from dim_most_recent_course_blocks
    expect:
      format: sql
      rows: |
        select * from dim_course_block_names_expected

  - name: test_dim_course_blocks
    model: dim_course_blocks
    config: 
      tags: 'dim'
    given:
      - input: ref('dim_most_recent_course_blocks')
        format: sql
        rows: |
          select * from dim_most_recent_course_blocks
      - input: ref('dim_course_names')
        format: sql
        rows: |
          select * from dim_course_names
    expect:
      format: sql
      rows: |
        select * from dim_course_blocks_expected

  - name: test_dim_course_names
    model: dim_course_names
    config: 
      tags: 'ci'
    given:
      - input: source("event_sink", "course_overviews")
        format: sql
        rows: |
          select * from event_sink.course_overviews
    expect:
      format: sql
      rows: |
        select * from dim_course_names_expected

  - name: test_dim_most_recent_course_blocks
    model: dim_most_recent_course_blocks
    config:
      tags: 'ci'
    given:
      - input: source("event_sink", "course_blocks")
        format: sql
        rows: |
          select * from event_sink.course_blocks
    expect:
      format: sql
      rows: |
        select * from dim_most_recent_course_blocks_expected

  - name: test_dim_course_subsection_items
    model: dim_course_subsection_items
    config:
      tags: 'ci'
    given:
      - input: ref('dim_course_blocks')
        format: sql
        rows: |
          select * from dim_course_blocks
    expect:
      format: sql
      rows: |
        select * from dim_course_subsection_items_expected

  - name: test_dim_course_blocks_deleted_blocks
    description: "Blocks missing from the latest publish are flagged, and a deleted section at the same position doesn't duplicate rows"
    model: dim_course_blocks
    config:
      tags: 'ci'
    given:
      - input: ref('dim_most_recent_course_blocks')
        format: sql
        rows: |
          select 'block-v1:Org0+P+R+type@chapter+block@chold' as location, 'Old section' as block_name, '1:0:0 - Old section' as display_name_with_location, toInt64(1) as section, toInt64(0) as subsection, toInt64(0) as unit, toUInt8(0) as graded, toInt32(1) as course_order, 'course-v1:Org0+P+R' as course_key, toUUID('00000000-0000-4000-8000-000000000001') as dump_id, '2024-01-01 00:00:00.000000' as time_last_dumped
          union all
          select 'block-v1:Org0+P+R+type@vertical+block@ud' as location, 'Deleted unit' as block_name, '1:1:3 - Deleted unit' as display_name_with_location, toInt64(1) as section, toInt64(1) as subsection, toInt64(3) as unit, toUInt8(0) as graded, toInt32(5) as course_order, 'course-v1:Org0+P+R' as course_key, toUUID('00000000-0000-4000-8000-000000000001') as dump_id, '2024-01-01 00:00:00.000000' as time_last_dumped
          union all
          select 'block-v1:Org0+P+R+type@chapter+block@ch1' as location, 'Section 1' as block_name, '1:0:0 - Section 1' as display_name_with_location, toInt64(1) as section, toInt64(0) as subsection, toInt64(0) as unit, toUInt8(0) as graded, toInt32(2) as course_order, 'course-v1:Org0+P+R' as course_key, toUUID('00000000-0000-4000-8000-000000000002') as dump_id, '2024-02-01 00:00:00.000000' as time_last_dumped
          union all
          select 'block-v1:Org0+P+R+type@sequential+block@s11' as location, 'Subsection 1.1' as block_name, '1:1:0 - Subsection 1.1' as display_name_with_location, toInt64(1) as section, toInt64(1) as subsection, toInt64(0) as unit, toUInt8(0) as graded, toInt32(3) as course_order, 'course-v1:Org0+P+R' as course_key, toUUID('00000000-0000-4000-8000-000000000002') as dump_id, '2024-02-01 00:00:00.000000' as time_last_dumped
          union all
          select 'block-v1:Org0+P+R+type@vertical+block@u1' as location, 'Unit 1' as block_name, '1:1:1 - Unit 1' as display_name_with_location, toInt64(1) as section, toInt64(1) as subsection, toInt64(1) as unit, toUInt8(0) as graded, toInt32(4) as course_order, 'course-v1:Org0+P+R' as course_key, toUUID('00000000-0000-4000-8000-000000000002') as dump_id, '2024-02-01 00:00:00.000000' as time_last_dumped
      - input: ref('dim_course_names')
        format: sql
        rows: |
          select 'course-v1:Org0+P+R' as course_key, 'Course P' as course_name, 'R' as course_run, 'Org0' as org, '' as tags_str
    expect:
      format: sql
      rows: |
        select 'Org0' as org, 'course-v1:Org0+P+R' as course_key, 'Course P' as course_name, 'R' as course_run, 'block-v1:Org0+P+R+type@chapter+block@chold' as block_id, 'block-v1:Org0+P+R+type@chapter+block@ch1' as section_block_id, '' as subsection_block_id, 'Old section' as block_name, '1:0:0' as section_number, '1:0:0' as subsection_number, '1:0:0' as hierarchy_location, '1:0:0 - Old section' as display_name_with_location, toInt32(1) as course_order, false as graded, 'section' as block_type, '1:0:0 - Section 1' as section_with_name, '' as subsection_with_name, toInt32(2) as section_course_order, toInt32(0) as subsection_course_order, false as in_latest_publish
        union all
        select 'Org0' as org, 'course-v1:Org0+P+R' as course_key, 'Course P' as course_name, 'R' as course_run, 'block-v1:Org0+P+R+type@vertical+block@ud' as block_id, 'block-v1:Org0+P+R+type@chapter+block@ch1' as section_block_id, 'block-v1:Org0+P+R+type@sequential+block@s11' as subsection_block_id, 'Deleted unit' as block_name, '1:0:0' as section_number, '1:1:0' as subsection_number, '1:1:3' as hierarchy_location, '1:1:3 - Deleted unit' as display_name_with_location, toInt32(5) as course_order, false as graded, 'unit' as block_type, '1:0:0 - Section 1' as section_with_name, '1:1:0 - Subsection 1.1' as subsection_with_name, toInt32(2) as section_course_order, toInt32(3) as subsection_course_order, false as in_latest_publish
        union all
        select 'Org0' as org, 'course-v1:Org0+P+R' as course_key, 'Course P' as course_name, 'R' as course_run, 'block-v1:Org0+P+R+type@chapter+block@ch1' as block_id, 'block-v1:Org0+P+R+type@chapter+block@ch1' as section_block_id, '' as subsection_block_id, 'Section 1' as block_name, '1:0:0' as section_number, '1:0:0' as subsection_number, '1:0:0' as hierarchy_location, '1:0:0 - Section 1' as display_name_with_location, toInt32(2) as course_order, false as graded, 'section' as block_type, '1:0:0 - Section 1' as section_with_name, '' as subsection_with_name, toInt32(2) as section_course_order, toInt32(0) as subsection_course_order, true as in_latest_publish
        union all
        select 'Org0' as org, 'course-v1:Org0+P+R' as course_key, 'Course P' as course_name, 'R' as course_run, 'block-v1:Org0+P+R+type@sequential+block@s11' as block_id, 'block-v1:Org0+P+R+type@chapter+block@ch1' as section_block_id, 'block-v1:Org0+P+R+type@sequential+block@s11' as subsection_block_id, 'Subsection 1.1' as block_name, '1:0:0' as section_number, '1:1:0' as subsection_number, '1:1:0' as hierarchy_location, '1:1:0 - Subsection 1.1' as display_name_with_location, toInt32(3) as course_order, false as graded, 'subsection' as block_type, '1:0:0 - Section 1' as section_with_name, '1:1:0 - Subsection 1.1' as subsection_with_name, toInt32(2) as section_course_order, toInt32(3) as subsection_course_order, true as in_latest_publish
        union all
        select 'Org0' as org, 'course-v1:Org0+P+R' as course_key, 'Course P' as course_name, 'R' as course_run, 'block-v1:Org0+P+R+type@vertical+block@u1' as block_id, 'block-v1:Org0+P+R+type@chapter+block@ch1' as section_block_id, 'block-v1:Org0+P+R+type@sequential+block@s11' as subsection_block_id, 'Unit 1' as block_name, '1:0:0' as section_number, '1:1:0' as subsection_number, '1:1:1' as hierarchy_location, '1:1:1 - Unit 1' as display_name_with_location, toInt32(4) as course_order, false as graded, 'unit' as block_type, '1:0:0 - Section 1' as section_with_name, '1:1:0 - Subsection 1.1' as subsection_with_name, toInt32(2) as section_course_order, toInt32(3) as subsection_course_order, true as in_latest_publish
